name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint the entrypoint
        run: shellcheck -s sh entrypoint.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fivem-enhanced:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (no CFX_URL must fail with exit 64 and say so)
        run: |
          set +e
          out=$(docker run --rm fivem-enhanced:ci 2>&1); rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 64
          echo "$out" | grep -q 'CFX_URL is not set'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fivem-enhanced
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=sha

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
