# FXServer (GTA V Enhanced) with txAdmin, plus MariaDB.
# Copy .env.example to .env, fill it in, then `docker compose up -d`.
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    env_file: .env            # MARIADB_* and TZ
    volumes:
      - db:/var/lib/mysql
    # Not published on the host: the server reaches it as `mariadb` on the
    # compose network. Maintenance: `docker compose exec mariadb mariadb -u...`.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  fivem:
    image: ghcr.io/chaosen3/fivem-enhanced:latest
    # Or build it here instead of pulling:
    # build: .
    # unless-stopped, not on-failure: on-failure never restores the container
    # after the daemon's clean shutdown at reboot, so the server stays down
    # until someone notices. A manual `docker stop` is still respected.
    restart: unless-stopped
    # FXServer flushes txAdmin and resource state on SIGTERM; compose's default
    # 10 s cuts it off mid-save.
    stop_grace_period: 60s
    depends_on:
      mariadb:
        condition: service_healthy   # honoured by `compose up`, not by the daemon's boot restore
    env_file: .env
    # Kept from the stack this was extracted from, where it has run from day
    # one. Not proven necessary; drop it and test if your host policy objects.
    security_opt:
      - seccomp:unconfined
    ports:
      - "30120:30120/tcp"
      - "30120:30120/udp"
      - "40120:40120/tcp"
    volumes:
      - cfx:/opt/cfx            # the fetched server artifact
      - ./txData:/txData        # txAdmin data: server.cfg, resources, logs
    stdin_open: true
    tty: true

volumes:
  db:
  cfx:
